<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>无限原野 · 开始游戏</title>
  <link rel="stylesheet" href="/scripts/extensions/third-party/infinite-fields/style.css">
  <link rel="stylesheet" href="/scripts/extensions/third-party/infinite-fields/start/play-town.css">
</head>
<body class="fields-start">
  <header class="start-header"><h1>无限原野</h1><nav aria-label="开始菜单">
    <button id="home-button">开始页</button><button id="settings-button">设置</button><button id="backup-button" disabled>保存备份</button>
  </nav></header>
  <main id="start-home">
    <p class="start-intro">浅河穿过村庄，桥头的面包摊已经开张。你的生活从河湾开始。</p>
    <section aria-labelledby="continue-title"><h2 id="continue-title">继续游戏</h2><div id="saved-games"></div></section>
    <section aria-labelledby="create-title"><h2 id="create-title">创建角色</h2>
      <form id="character-form">
        <label>姓名<input name="name" required maxlength="60" value="旅人" autocomplete="off"></label>
        <label>性别<input name="gender" maxlength="40" value="未指定"></label>
        <label>外貌与背景<textarea name="appearance" required maxlength="1000" rows="3">一位初到河谷的旅人。</textarea></label>
        <p>出生地：河湾村。六项属性共60点，每项8至16点。</p>
        <div id="attributes" class="start-attributes"></div><p id="attribute-total" aria-live="polite"></p>
        <button type="submit">创建并进入</button>
      </form>
    </section>
    <section aria-labelledby="saves-title"><h2 id="saves-title">存档管理</h2>
      <label>导入备份<input id="import-file" type="file" accept=".json,application/json"></label>
      <p>每次导入都会建立独立存档。备份包含聊天、人物笔记、传闻判断和阅读设置。</p>
    </section>
  </main>
  <section id="arrival" hidden aria-labelledby="arrival-title"><h2 id="arrival-title"></h2><div id="arrival-text"></div><aside id="loading-knowledge"></aside><button id="enter-button">进入游戏</button></section>
  <p id="start-status" role="status" aria-live="polite">正在读取本地游戏。</p>
  <iframe id="game-host" src="/" title="无限原野游戏" hidden></iframe>
  <script type="module" src="/scripts/extensions/third-party/infinite-fields/start/play-town.js"></script>
</body>
</html>
